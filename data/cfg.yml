# ============================================================================
# doc_process_agent 配置（本地环境，不提交 Git）
# ============================================================================

server:
  port: 20001
  debug: true
  cert_file: "deploy/certs/cert.pem"
  key_file: "deploy/certs/key.pem"

sys:
  max_concurrent_tasks: 5
  max_pending_tasks: 10
  callback_url_token: ""
  callback_retries: 3
  callback_retry_interval_sec: 2
  retention_days: 30
  model: "claude-sonnet-4-20250514"
  doc_util_url: "https://doc_util_server:8443"